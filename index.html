w:hidden;user-select:none}.card .cs{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--cy);color:#001;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}.card .rt{position:absolute;top:3px;right:5px;font-size:10px;color:var(--c);font-weight:800}.card .ar{font-size:30px;margin:14px 0 2px;filter:drop-shadow(0 0 6px var(--e))}.card .nm{font-size:11px;font-weight:700;line-height:1.2}.card .ds{font-size:10px;color:var(--dim);margin-top:auto;padding-bottom:2px;line-height:1.25}.r3,.r4{animation:gl 2s infinite alternate}.r4{border-image:linear-gradient(135deg,#ff3d6e,#ffb020,#7cff6b,#00e5ff,#b56bff) 1;border-radius:0}@keyframes gl{to{box-shadow:0 0 22px var(--c)}}.bf{display:flex;flex-direction:column;min-height:100%}.zn{flex:1 1 0;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}.zn .pn{margin:0;min-height:88px}.zn .av{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1}.zn .tg{min-height:26px}.bf .log{border-top:1px dashed var(--ln);border-bottom:1px dashed var(--ln);margin:4px 0;display:flex;align-items:center;justify-content:center}.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px}.hand .card{flex:0 0 92px;height:136px}.hand .card.no{opacity:.4;filter:grayscale(.7)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .card{height:140px}.grid .card.un{opacity:.25;filter:grayscale(1)}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{flex:0 0 auto;background:var(--pn);border:1px solid var(--ln);color:var(--dim);border-radius:16px;padding:5px 12px;font-size:13px}.tabs button.on{color:var(--cy);border-color:var(--cy)}.search{width:100%;background:var(--pn);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit}.search:focus{border-color:var(--cy);box-shadow:0 0 10px #00e5ff44}.search::placeholder{color:var(--dim)}.empty{color:var(--dim);text-align:center;grid-column:1/-1;padding:30px 0}.ov{position:fixed;inset:0;background:#02060cee;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-y:auto}.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:500px}.pulls .card{height:112px;animation:pop .5s both}.pulls .card .ar{font-size:22px;margin-top:12px}.pulls .card .ds{display:none}@keyframes pop{from{transform:rotateY(90deg) scale(.5);opacity:0}}.spin{width:70px;height:70px;border:3px solid var(--ln);border-top-color:var(--cy);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:#000a;margin:2px 3px 0 0}.log{min-height:34px;text-align:center;color:var(--cy);font-size:13px;padding:4px}.new{position:absolute;bottom:2px;left:0;right:0;font-size:10px;color:var(--gr);font-weight:800}h3{margin:4px 0 8px;color:var(--cy)}.reactor-ic{font-size:64px;filter:drop-shadow(0 0 16px var(--cy))}.split{display:flex;gap:10px}.split .half{flex:1;min-width:0;display:flex;flex-direction:column}.split .list{flex:1;overflow-y:auto;max-height:calc(100vh - 280px)}.split .list .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.split .list .grid .card{height:100px}.split .list .grid .card .ar{font-size:22px;margin:8px 0 2px}.split .list .grid .card .nm{font-size:10px}.split .list .grid .card .ds{font-size:9px}.split .right .grid{grid-template-columns:repeat(2,1fr)}.split .right .grid .card{height:100px}.split .right .grid .card .ar{font-size:20px;margin:8px 0 2px}.split .right .grid .card .nm{font-size:9px}.split .right .grid .card .ds{display:none}.btn,nav button,.tabs button{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,color .2s,border-color .2s}.btn:hover{box-shadow:0 0 22px #00e5ff99}.rp{position:absolute;border-radius:50%;background:#ffffff55;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}nav button.on{animation:nb .35s}@keyframes nb{50%{transform:translateY(-5px)}}header b{animation:tg 3s ease-in-out infinite alternate}@keyframes tg{to{text-shadow:0 0 22px var(--cy),0 0 4px #fff}}.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3);box-shadow:0 0 18px var(--cy)}}body:after{content:"";position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,#00e5ff10,transparent);animation:scan 7s linear infinite;pointer-events:none}@keyframes scan{to{top:100%}}main.sw>*{animation:fi .35s both}@keyframes fi{from{opacity:0;transform:translateY(12px)}}.orb{animation:flt 3s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-9px) scale(1.06)}}.card{transition:transform .15s}.grid>div:active .card,.grid .card:active{transform:scale(.94)}.pulls .card.r3,.pulls .card.r4{animation:pop .5s both,gl 1.6s .6s infinite alternate}.hand>div{transition:transform .15s}.hand>div:active{transform:translateY(-10px) scale(1.06)}.hand>div.used{animation:used .25s forwards}@keyframes used{to{transform:translateY(-70px) scale(1.15);opacity:0}}.hand.deal>div{animation:deal .4s both}@keyframes deal{from{transform:translateY(50px) rotate(8deg);opacity:0}}.hurt{animation:hurt .4s}@keyframes hurt{25%{transform:translateX(-7px);background:#ff3d6e44}75%{transform:translateX(7px)}}.heal{animation:hl .6s}@keyframes hl{50%{box-shadow:0 0 18px var(--gr)}}.fl{position:absolute;right:14px;top:4px;font:800 24px Orbitron,sans-serif;pointer-events:none;animation:fu 1s forwards;text-shadow:0 0 8px #000}.fd{color:var(--rd)}.fh{color:var(--gr)}@keyframes fu{to{transform:translateY(-34px);opacity:0}}.deck-switching{animation:deckSwitch .42s ease both}@keyframes deckSwitch{0%{opacity:.35;transform:translateY(10px) scale(.985);filter:brightness(1.6)}60%{opacity:1;transform:translateY(-2px) scale(1.005);filter:brightness(1.15)}100%{opacity:1;transform:translateY(0) scale(1);filter:brightness(1)}}.deck-switching .card{animation:deckCardIn .38s ease both}.deck-switching .card:nth-child(2n){animation-delay:.04s}.deck-switching .card:nth-child(3n){animation-delay:.08s}@keyframes deckCardIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><div id="app"><header><b class="o">NEXUS // CARDS</b><span class="chips o" id="chips"></span></header><main id="main"></main><nav id="nav"></nav></div>
<script>
const E=[["量子","⚛️","#00e5ff"],["等離子","🌀","#ff3df2"],["奈米","🧫","#7cff6b"],["重力","🪐","#ffb020"],["暗物質","🌑","#8a5cff"]];
const TY=[["atk","脈衝炮",6,"⚡"],["multi","連射陣列",3,"✦"],["pierce","穿甲彈",5,"🎯"],["block","能量護盾",5,"🛡️"],["heal","修復模組",4,"💊"],["draw","資料鏈路",0,"📡"],["energy","核心充能",0,"🔋"],["poison","病毒注入",3,"☣️"],["buff","基因增幅",0,"🧬"],["drain","汲能觸鬚",4,"🩸"]],TYL={atk:"⚡ 攻擊",multi:"✦ 連擊",pierce:"🎯 穿甲",block:"🛡️ 護盾",heal:"💊 治療",draw:"📡 抽牌",energy:"🔋 充能",poison:"☣️ 中毒",buff:"🧬 增幅",drain:"🩸 汲取"};
const TW=["初級","進階","精英","傳說","奇點"],M=[1,1.7,3.5,4.6,7.2],CO=[1,1,2,2,3],RN=["N","R","SR","SSR","UR"],RC=["#8fa3b8","#4da3ff","#b56bff","#ffb020","#ff3d6e"],SP={draw:[1,2,2,3,3],energy:[1,2,2,3,3],buff:[1,1,2,3,4],poison:[3,5,8,12,18]},SC=[0,1,1,2,2],CARDS=[];
E.forEach((e,ei)=>TY.forEach((t,ti)=>{for(let k=0;k<5;k++){let ty=t[0],v=SP[ty]?SP[ty][k]:Math.round(t[2]*M[k]*(ty=="multi"?.75:1));CARDS.push({id:ei*50+ti*5+k,n:e[0]+TW[k]+t[1],t:ty,v,h:ty=="multi"?(k<2?2:k<4?3:4):1,cost:(ty=="draw"||ty=="energy")?SC[k]:CO[k],r:k,e:ei,ic:t[3]})}}));
const dsc=c=>({atk:`造成 ${c.v} 傷害`,multi:`${c.h} 次各 ${c.v} 傷害`,pierce:`${c.v} 穿透傷害(無視護盾)`,block:`獲得 ${c.v} 護盾`,heal:`回復 ${c.v} 生命`,draw:`抽 ${c.v} 張牌`,energy:`獲得 ${c.v} 能量`,poison:`施加 ${c.v} 層毒素`,buff:`永久 +${c.v} 攻擊力`,drain:`造成 ${c.v} 傷害並回復等量`}[c.t]);
const cardH=(c,x="",st="")=>`<div class="card r${c.r} ${x}" style="--c:${RC[c.r]};--e:${E[c.e][2]};${st}"><span class="cs o">${c.cost}</span><span class="rt o">${RN[c.r]}</span><div class="ar">${c.ic}</div><div class="nm">${c.n}</div><div class="ds">${dsc(c)}</div></div>`;
let S,B=null,tab="battle",fl=-1,busy=false,navTab="",cf=-1,gm="e",sq="",curDeck=0,deckSq="",reactorTimer=null;const K="nexus_cards_v1",$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=a=>a[Math.floor(Math.random()*a.length)];
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S){S={chips:1500,own:{},deck:[],decks:{0:[],1:[],2:[]},stage:1,pity:0,pulls:0};let p=CARDS.filter(c=>c.r==0).sort(()=>Math.random()-.5);[...p.filter(c=>["atk","block","multi"].includes(c.t)).slice(0,6),...p.filter(c=>!["atk","block","multi"].includes(c.t)).slice(0,6)].forEach(c=>S.own[c.id]=1);S.deck=Object.keys(S.own).map(Number);S.decks[0]=[...S.deck];save()}if(!S.decks)S.decks={0:[...(S.deck||[])],1:[],2:[]};[0,1,2].forEach(i=>{if(!Array.isArray(S.decks[i]))S.decks[i]=[]});if(!S.lastCollect){S.lastCollect=Date.now();save()}S.deck=[...S.decks[curDeck||0]]}
function updChips(){let c=$("chips"),t="◈ "+S.chips;if(c.textContent!=t)c.textContent=t}function pageIn(){$("main").classList.add("sw");setTimeout(()=>$("main").classList.remove("sw"),450)}function go(k){if(tab==k)return;if(tab=="reactor"&&reactorTimer){clearInterval(reactorTimer);reactorTimer=null}tab=k;pageIn();render()}
function render(){updChips();if(navTab!=tab){navTab=tab;$("nav").innerHTML=[["battle","⚔️ 戰鬥"],["gacha","🎴 抽卡"],["coll","📚 卡庫"],["deck","🃏 牌組"],["reactor","⚡ 反應爐"]].map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}if(tab=="battle")B&&!B.over?rBattle():rHome();else if(tab=="gacha")rGacha();else if(tab=="coll")rColl();else if(tab=="deck")rDeck();else rReactor()}
function rHome(){$("main").innerHTML=`<div class="pn" style="text-align:center"><h3 class="o">SECTOR ${S.stage}</h3><p style="color:var(--dim)">${S.stage%5==0?"⚠ 首領關卡":"入侵者偵測中"}</p><p>出戰牌組:<b style="color:var(--cy)">${S.deck.length}</b> / 20 張</p><button class="btn" onclick="startBattle()">▶ 進入戰鬥</button></div><div class="pn"><h3>玩法說明</h3><p style="font-size:13px;line-height:1.7;color:var(--dim);margin:0">每回合獲得 3 點能量並抽至 5 張牌。點擊手牌出牌,能量不足無法使用。勝利可獲得晶片,用於抽卡。請到「牌組」分頁調整三副牌組。</p></div><div class="pn"><span class="tag">已收集 ${Object.keys(S.own).length}/250</span><span class="tag">總抽數 ${S.pulls}</span><span class="tag">最高 SECTOR ${S.stage}</span></div>`}
function startBattle(){if(S.deck.length<5)return alert("牌組至少需要 5 張牌!");const st=S.stage,boss=st%5==0,mr=Math.min(4,Math.floor((st+2)/5)),pool=CARDS.filter(c=>c.r<=mr&&!['draw','energy'].includes(c.t)),nm=rnd(["虛空","機械","暗網","量子","熔核","霜藍"])+rnd(["哨兵","獵手","巨像","AI","無人機","指揮官"]),hp=Math.round((28+st*9)*(boss?Math.max(1.25,1.7-st*.04):1));B={P:{hp:80,max:80,bl:0,st:0,po:0,en:3},X:{n:(boss?"👑 BOSS·":"")+nm,hp,max:hp,bl:0,st:0,po:0,en:st>=4?4:3},draw:[...S.deck].sort(()=>Math.random()-.5).map(i=>CARDS[i]),disc:[],hand:[],pool,log:"戰鬥開始!",over:false};startTurn()}
function drawC(n){while(n--){if(!B.draw.length){B.draw=B.disc.sort(()=>Math.random()-.5);B.disc=[]}if(!B.draw.length)break;if(B.hand.length<10)B.hand.push(B.draw.pop())}}function startTurn(){let P=B.P;P.bl=0;P.en=3;if(P.po){P.hp-=P.po;P.po--;if(P.hp<=0)return end(false)}drawC(5-B.hand.length);let X=B.X,en=X.en;B.plan=[];[...B.pool].sort(()=>Math.random()-.5).slice(0,4).forEach(c=>{if(c.cost<=en){en-=c.cost;B.plan.push(c)}});busy=false;B.deal=true;render()}
function ev(c,s){if(s!==B.X)return c.v;let m=c.t=="poison"?.7:["atk","multi","pierce","drain","block","heal"].includes(c.t)?.85:1;return m==1?c.v:Math.max(1,Math.round(c.v*m))}function sb(s){return s===B.X?Math.min(s.st,3):s.st}function hit(t,n,pierce){let a=pierce?0:Math.min(t.bl,n);t.bl-=a;let d=n-a;t.hp-=d;return d}function apply(c,s,t){let b=sb(s),V=ev(c,s);switch(c.t){case"atk":hit(t,V+b);break;case"multi":for(let i=0;i<c.h;i++)hit(t,V+b);break;case"pierce":hit(t,V+b,1);break;case"block":s.bl+=V;break;case"heal":s.hp=Math.min(s.max,s.hp+V);break;case"draw":drawC(c.v);break;case"energy":s.en+=c.v;break;case"poison":t.po+=V;break;case"buff":s.st+=c.v;break;case"drain":{let d=hit(t,V+b);s.hp=Math.min(s.max,s.hp+d)}}}
function play(i){if(busy||B.over)return;let c=B.hand[i];if(c.cost>B.P.en){fl=i;render();fl=-1;return}B.P.en-=c.cost;B.hand.splice(i,1);B.disc.push(c);apply(c,B.P,B.X);B.log=`你使用了【${c.n}】`;if(B.X.hp<=0)return end(true);render()}async function endTurn(){if(busy||B.over)return;busy=true;let X=B.X,P=B.P;B.disc.push(...B.hand);B.hand=[];X.bl=0;if(X.po){X.hp-=X.po;X.po--;B.log="敵人受到毒素傷害";render();await sleep(500);if(X.hp<=0)return end(true)}for(let c of B.plan){B.log=`敵方使用【${c.n}】`;apply(c,X,P);render();await sleep(600);if(P.hp<=0)return end(false)}startTurn()}
function end(w){B.over=true;busy=false;let g=w?100+S.stage*30:20;if(w)S.stage++;S.chips+=g;save();let o=document.createElement("div");o.className="ov";o.innerHTML=`<h2 class="o" style="color:${w?'var(--gr)':'var(--rd)'}">${w?'VICTORY':'DEFEATED'}</h2><p>獲得 ◈ ${g} 晶片</p><button class="btn">確定</button>`;o.querySelector("button").onclick=()=>{o.remove();B=null;render()};document.body.appendChild(o)}
function intent(){let a=0,b=0,p=0;B.plan.forEach(c=>{let v=ev(c,B.X),k=sb(B.X);if(["atk","pierce","drain"].includes(c.t))a+=v+k;if(c.t=="multi")a+=(v+k)*c.h;if(c.t=="block")b+=v;if(c.t=="poison")p+=v});return`${a?`<span class="tag">⚔️ ${a}</span>`:""}${b?`<span class="tag">🛡️ ${b}</span>`:""}${p?`<span class="tag">☣️ ${p}</span>`:""}${B.plan.length?"":"<span class='tag'>待機</span>"}`}
function rBattle(){let P=B.P,X=B.X,bar=(o,c)=>`<div class="bar"><i style="width:${Math.max(0,o.hp/o.max*100)}%;background:${c}"></i></div>`;$('main').innerHTML=`<div class="bf"><div class="zn"><div class="pn"><div style="display:flex;justify-content:space-between"><b>${X.n}</b><span>${Math.max(0,X.hp)}/${X.max}</span></div>${bar(X,'var(--rd)')}<div>${intent()}</div></div><div class="av">${X.n.includes('BOSS')?'👹':'👾'}</div></div><div class="log">${B.log}</div><div class="zn"><div class="av">🛰️</div><div class="pn"><div style="display:flex;justify-content:space-between"><b>你</b><span>${Math.max(0,P.hp)}/${P.max}</span></div>${bar(P,'var(--gr)')}<span class="tag">🔋 能量 ${P.en}/3</span><span class="tag">牌庫 ${B.draw.length}</span></div></div><div class="hand">${B.hand.map((c,i)=>`<div onclick="play(${i})" style="flex:0 0 92px">${cardH(c,c.cost>P.en?'no':'')}</div>`).join('')}</div><button class="btn" style="width:100%" onclick="endTurn()">結束回合 ▶</button></div>`}
function roll(){let w=[50,30,14,5,1],x=Math.random()*100,r=0;for(;r<4&&x>=w[r];r++)x-=w[r];return r}function pull(n){let cost=n==1?100:900;if(S.chips<cost)return alert("晶片不足");S.chips-=cost;let rs=[];for(let i=0;i<n;i++){let r=roll();S.pity++;if(S.pity>=40&&r<3)r=Math.random()<.15?4:3;if(r>=3)S.pity=0;rs.push(r)}if(n==10&&!rs.some(r=>r>=2))rs[9]=2;let got=rs.map(r=>rnd(CARDS.filter(c=>c.r==r)));S.pulls+=n;let RF=[10,30,80,200,500];got.forEach(c=>{if(!S.own[c.id])S.own[c.id]=1;else S.chips+=RF[c.r]});save();render()}function rGacha(){$('main').innerHTML=`<div class="pn" style="text-align:center"><h3 class="o">QUANTUM GACHA</h3><div class="orb" style="font-size:64px">🔮</div><p style="color:var(--dim);font-size:12px;line-height:1.7">N 50% · R 30% · SR 14% · SSR 5% · UR 1%<br>保底進度 ${S.pity}/40</p><button class="btn" onclick="pull(1)">單抽 ◈100</button> <button class="btn" onclick="pull(10)">十連 ◈900</button></div>`}
function setGM(g){gm=g;cf=-1;renderCollBody()}function setCF(v){cf=v;renderCollBody()}function onSearch(v){sq=v;renderCollBody()}function matchG(c){if(cf<0)return true;if(gm=='e')return c.e==cf;if(gm=='t')return c.t==cf;if(gm=='r')return c.r==cf;if(gm=='cost')return c.cost==cf}function matchQ(c){if(!sq.trim())return true;let s=sq.trim().toLowerCase();return [c.n,dsc(c),RN[c.r],E[c.e][0],TYL[c.t]].some(v=>v.toLowerCase().includes(s))}
function rColl(){$('main').innerHTML=`<div class="pn" style="display:flex;justify-content:space-between"><span>收集 <b style="color:var(--cy)">${Object.keys(S.own).length}/250</b></span><span class="tag">收藏庫</span></div><input class="search" placeholder="🔍 搜尋卡名或效果" value="${sq}" oninput="onSearch(this.value)"><div id="collBody"></div>`;renderCollBody()}function renderCollBody(){let l=CARDS.filter(c=>matchG(c)&&matchQ(c)).sort((a,b)=>(!!S.own[b.id])-(!!S.own[a.id])||b.r-a.r||a.id-b.id),sub=gm=='e'?E.map((e,i)=>`<button class="${cf==i?'on':''}" onclick="setCF(${i})">${e[1]} ${e[0]}</button>`).join(''):gm=='t'?TY.map(t=>`<button class="${cf==t[0]?'on':''}" onclick="setCF('${t[0]}')">${TYL[t[0]]}</button>`).join(''):gm=='r'?RN.map((r,i)=>`<button class="${cf==i?'on':''}" onclick="setCF(${i})">${r}</button>`).join(''):[0,1,2,3].map(v=>`<button class="${cf==v?'on':''}" onclick="setCF(${v})">◈ ${v}</button>`).join('');$('collBody').innerHTML=`<div class="tabs">${[['e','屬性'],['t','效果'],['r','稀有度'],['cost','耗費']].map(([k,n])=>`<button class="${gm==k?'on':''}" onclick="setGM('${k}')">${n}</button>`).join('')}</div><div class="tabs"><button class="${cf<0?'on':''}" onclick="setCF(-1)">全部</button>${sub}</div><div class="grid">${l.length?l.map(c=>S.own[c.id]?`<div>${cardH(c)}</div>`:cardH(c,'un')).join(''):'<p class="empty">沒有符合的卡牌</p>'}</div>`}
function setDeck(i){if(curDeck===i)return;curDeck=i;S.deck=[...S.decks[i]];save();renderDeckBody();const body=$("deckBody");if(body){body.classList.remove("deck-switching");void body.offsetWidth;body.classList.add("deck-switching")}}const REACTOR_CAP_H=8;function reactorRate(){return 10+S.stage*5}function reactorPending(){let elapsed=Math.max(0,Date.now()-(S.lastCollect||Date.now())),cap=REACTOR_CAP_H*3600000;return{pending:Math.floor(reactorRate()*Math.min(REACTOR_CAP_H,elapsed/3600000)),elapsed,cap,capped:elapsed>=cap}}function fmtDur(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} 時 ${m} 分`:m?`${m} 分`: `${s} 秒`}function rReactor(){if(reactorTimer)clearInterval(reactorTimer);renderReactorBody();reactorTimer=setInterval(()=>{if(tab=='reactor')renderReactorBody()},1000)}function collectReactor(){let p=reactorPending().pending;if(!p)return;S.chips+=p;S.lastCollect=Date.now();save();renderReactorBody();updChips()}function renderReactorBody(){let q=reactorPending(),pct=Math.min(100,q.elapsed/q.cap*100),max=Math.floor(reactorRate()*REACTOR_CAP_H);$('main').innerHTML=`<div class="pn" style="text-align:center"><h3 class="o">QUANTUM REACTOR</h3><div class="orb reactor-ic">⚡</div><p style="color:var(--dim);font-size:13px">離線期間持續產生晶片,最多累積 ${REACTOR_CAP_H} 小時</p><div class="bar"><i style="width:${pct}%;background:var(--cy)"></i></div><p>目前累積 <b style="color:var(--cy)">◈ ${q.pending}</b> / ◈ ${max}</p><p style="color:var(--dim);font-size:12px">已運轉 ${fmtDur(q.elapsed)}</p><button class="btn" style="width:100%" onclick="collectReactor()" ${q.pending?'':'disabled'}>⚡ 收取 ◈ ${q.pending}</button></div><div class="pn"><h3>反應爐資訊</h3><p style="color:var(--dim);font-size:13px;line-height:1.8;margin:0">產出速率: ◈ ${reactorRate()} / 小時<br>離線上限: ${REACTOR_CAP_H} 小時<br>產出會隨 SECTOR 提升。</p></div>`}
document.addEventListener('pointerdown',e=>{let b=e.target.closest('.btn,nav button,.tabs button');if(!b||b.disabled)return;let r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,d=document.createElement('span');d.className='rp';d.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),550)});load();render();
</script></body></html>
