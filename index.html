<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS 量子卡牌戰</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080f;--pn:#0a1424;--ln:#123a52;--cy:#00e5ff;--tx:#dff6ff;--dim:#6f8fa3;--rd:#ff3d6e;--gr:#7cff6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 50% -10%,#0b2a44,var(--bg) 60%),var(--bg)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#00e5ff10 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,#00e5ff10 1px,transparent 1px) 0 0/28px 100%;pointer-events:none}
#app{position:relative;height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column}
.o{font-family:Orbitron,system-ui,sans-serif;letter-spacing:1px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}
header b{color:var(--cy);text-shadow:0 0 10px var(--cy)}
.chips{background:#00e5ff18;border:1px solid var(--cy);border-radius:20px;padding:3px 12px;font-size:14px}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;flex:0 0 auto;gap:4px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--ln);background:#050d18;padding:0 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:0 0 88px;background:none;border:0;color:var(--dim);padding:12px 4px;font-size:13px;white-space:nowrap;scroll-snap-align:center}
nav button.on{color:var(--cy);text-shadow:0 0 8px var(--cy);box-shadow:inset 0 2px var(--cy)}
.btn{background:linear-gradient(135deg,#00e5ff33,#0066ff33);border:1px solid var(--cy);color:var(--tx);border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;box-shadow:0 0 14px #00e5ff44}
.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.4}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.bar{height:12px;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;transition:width .4s}
.card{--c:#8fa3b8;position:relative;border:2px solid var(--c);border-radius:10px;background:linear-gradient(160deg,#0d1d33,#060b16);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent);padding:4px;display:flex;flex-direction:column;text-align:center;overflow:hidden;user-select:none}
.card .cs{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--cy);color:#001;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.card .rt{position:absolute;top:3px;right:5px;font-size:10px;color:var(--c);font-weight:800}
.card .ar{font-size:30px;margin:14px 0 2px;filter:drop-shadow(0 0 6px var(--e))}
.card .nm{font-size:11px;font-weight:700;line-height:1.2}
.card .ds{font-size:10px;color:var(--dim);margin-top:auto;padding-bottom:2px;line-height:1.25}
.r3,.r4{animation:gl 2s infinite alternate}.r4{border-image:linear-gradient(135deg,#ff3d6e,#ffb020,#7cff6b,#00e5ff,#b56bff) 1;border-radius:0}
@keyframes gl{to{box-shadow:0 0 22px var(--c)}}
.bf{display:flex;flex-direction:column;min-height:100%}
.zn{flex:1 1 0;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.zn .pn{margin:0;min-height:88px}
.zn .av{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1}
.zn .tg{min-height:26px}
.bf .log{border-top:1px dashed var(--ln);border-bottom:1px dashed var(--ln);margin:4px 0;display:flex;align-items:center;justify-content:center}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px}
.hand .card{flex:0 0 92px;height:136px}
.hand .card.no{opacity:.4;filter:grayscale(.7)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .card{height:140px}.grid .card.un{opacity:.25;filter:grayscale(1)}
.card.in:after{content:"✔ 出戰";position:absolute;bottom:0;left:0;right:0;background:var(--cy);color:#001;font-size:10px;font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{flex:0 0 auto;background:var(--pn);border:1px solid var(--ln);color:var(--dim);border-radius:16px;padding:5px 12px;font-size:13px}
.tabs button.on{color:var(--cy);border-color:var(--cy)}
.search{width:100%;background:var(--pn);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit}
.search:focus{border-color:var(--cy);box-shadow:0 0 10px #00e5ff44}
.search::placeholder{color:var(--dim)}
.empty{color:var(--dim);text-align:center;grid-column:1/-1;padding:30px 0}
.ov{position:fixed;inset:0;background:#02060cee;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-y:auto}
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:500px}
.pulls .card{height:112px;animation:pop .5s both}.pulls .card .ar{font-size:22px;margin-top:12px}
.pulls .card .ds{display:none}
@keyframes pop{from{transform:rotateY(90deg) scale(.5);opacity:0}}
.spin{width:70px;height:70px;border:3px solid var(--ln);border-top-color:var(--cy);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:#000a;margin:2px 3px 0 0}
.log{min-height:34px;text-align:center;color:var(--cy);font-size:13px;padding:4px}
.new{position:absolute;bottom:2px;left:0;right:0;font-size:10px;color:var(--gr);font-weight:800}
h3{margin:4px 0 8px;color:var(--cy)}
.reactor-ic{font-size:64px;filter:drop-shadow(0 0 16px var(--cy))}
.reactor-cap{color:var(--gr);font-weight:800}

/* ---- animations ---- */
.pn{position:relative}
.btn,nav button,.tabs button{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,color .2s,border-color .2s}
.btn:hover{box-shadow:0 0 22px #00e5ff99}
.btn:not([disabled]){animation:bp 2.4s infinite}
@keyframes bp{50%{box-shadow:0 0 22px #00e5ffaa}}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);animation:sh 3.2s infinite}
@keyframes sh{60%,100%{left:140%}}
.rp{position:absolute;border-radius:50%;background:#ffffff55;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
nav button.on{animation:nb .35s}
@keyframes nb{50%{transform:translateY(-5px)}}
.tabs button:active{transform:scale(.92)}
header b{animation:tg 3s ease-in-out infinite alternate}
@keyframes tg{to{text-shadow:0 0 22px var(--cy),0 0 4px #fff}}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3);box-shadow:0 0 18px var(--cy)}}
body:after{content:"";position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,#00e5ff10,transparent);animation:scan 7s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
main.sw>*{animation:fi .35s both}
main.sw>*:nth-child(2){animation-delay:.07s}main.sw>*:nth-child(3){animation-delay:.14s}
@keyframes fi{from{opacity:0;transform:translateY(12px)}}
.ov{animation:ovi .25s}@keyframes ovi{from{opacity:0}}
.ov.flash{animation:fs .9s}@keyframes fs{from{background:var(--rc)}}
.orb{animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-9px) scale(1.06)}}
.card{transition:transform .15s}
.grid>div:active .card,.grid .card:active{transform:scale(.94)}
.pulls .card.r3,.pulls .card.r4{animation:pop .5s both,gl 1.6s .6s infinite alternate}
.hand>div{transition:transform .15s}
.hand>div:active{transform:translateY(-10px) scale(1.06)}
.hand>div.used{animation:used .25s forwards}
@keyframes used{to{transform:translateY(-70px) scale(1.15);opacity:0}}
.hand.deal>div{animation:deal .4s both}
.hand.deal>div:nth-child(2){animation-delay:.07s}.hand.deal>div:nth-child(3){animation-delay:.14s}.hand.deal>div:nth-child(4){animation-delay:.21s}.hand.deal>div:nth-child(n+5){animation-delay:.28s}
@keyframes deal{from{transform:translateY(50px) rotate(8deg);opacity:0}}
.hurt{animation:hurt .4s}
@keyframes hurt{25%{transform:translateX(-7px);background:#ff3d6e44}75%{transform:translateX(7px)}}
.heal{animation:hl .6s}@keyframes hl{50%{box-shadow:0 0 18px var(--gr)}}
.fl{position:absolute;right:14px;top:4px;font:800 24px Orbitron,sans-serif;pointer-events:none;animation:fu 1s forwards;text-shadow:0 0 8px #000}
.fd{color:var(--rd)}.fh{color:var(--gr)}
@keyframes fu{to{transform:translateY(-34px);opacity:0}}
.tag{animation:fi .3s both}
.deck-panel{margin-bottom:10px}.deck-current{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.deck-current .card{height:108px}.deck-current .card .ar{font-size:22px;margin:9px 0 2px}.deck-current .card .nm{font-size:9px}.deck-current .card .ds{display:none}.deck-owned{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.deck-owned .card{height:128px}.deck-switching{animation:deckSwitch .35s ease both}@keyframes deckSwitch{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.deck-switching .card{animation:deckCard .32s ease both}@keyframes deckCard{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.mission-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.mission-card{border-left:3px solid var(--ln);transition:border-color .25s,box-shadow .25s}.mission-card.done{border-left-color:var(--gr);box-shadow:0 0 14px #7cff6b22}.mission-card.claimed{opacity:.58;filter:grayscale(.4)}.mission-row{display:flex;align-items:center;gap:10px}.mission-icon{width:38px;height:38px;border-radius:10px;background:#00e5ff16;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}.mission-info{flex:1;min-width:0}.mission-title{font-size:14px;font-weight:700}.mission-desc{font-size:12px;color:var(--dim);margin-top:3px}.mission-progress{font-size:12px;color:var(--cy);white-space:nowrap}.mission-card .bar{margin:9px 0 8px;height:8px}.mission-card .btn{width:100%;padding:8px;font-size:13px}.mission-date{font-size:11px;color:var(--dim);text-align:right}
.up-core{width:60%;margin:0 auto 12px;text-align:center;padding:8px;border:1px solid var(--cy);border-radius:12px;background:#00e5ff14;box-shadow:0 0 14px #00e5ff44;color:var(--cy);font-size:13px}.up-fork{position:relative;height:18px;margin:0 16.66%;border:2px solid var(--cy);border-bottom:0;opacity:.7}.up-fork:before{content:"";position:absolute;left:50%;top:-12px;height:12px;border-left:2px solid var(--cy)}.up-fork:after{content:"";position:absolute;left:50%;top:0;height:100%;border-left:2px solid var(--cy)}.up-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.up-col{display:flex;flex-direction:column}.up-br{text-align:center;font-size:12px;color:var(--dim);margin:2px 0 6px}.up-node{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 5px;text-align:center}.up-node.open{border-color:var(--cy);box-shadow:0 0 10px #00e5ff33}.up-node.max{border-color:var(--gr);box-shadow:0 0 10px #7cff6b33}.up-node.lock{opacity:.45;filter:grayscale(.6)}.up-ic{font-size:24px}.up-nm{font-size:12px;font-weight:700;margin-top:2px}.up-lv{font-size:10px;color:var(--cy);margin:2px 0}.up-ds{font-size:10px;color:var(--dim);min-height:26px;line-height:1.3}.up-node .btn{width:100%;padding:5px 2px;font-size:11px;margin-top:5px}.up-link{width:2px;height:14px;background:var(--ln);margin:0 auto}.up-link.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
.rl-slots{display:flex;gap:8px;margin-bottom:10px}.rl-slot{flex:1;height:64px;border:1px dashed var(--ln);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--dim)}.rl-slot.on{border:1px solid var(--cy);box-shadow:0 0 12px #00e5ff44;background:#00e5ff10}.rl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.rl-pick{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}.rl-card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;min-height:110px}.rl-card.own{cursor:pointer;border-color:#00e5ff66}.rl-card.eq{border-color:var(--cy);box-shadow:0 0 12px #00e5ff44}.rl-card.lock{opacity:.35;filter:grayscale(1)}.rl-ic{font-size:30px}.rl-nm{font-size:13px;font-weight:700;margin-top:4px}.rl-ds{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.4}.rl-st{font-size:10px;margin-top:6px;color:var(--cy)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
<header><b class="o">NEXUS // CARDS</b><span class="chips o" id="chips"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<script>
const E=[["量子","⚛️","#00e5ff"],["等離子","🌀","#ff3df2"],["奈米","🧫","#7cff6b"],["重力","🪐","#ffb020"],["暗物質","🌑","#8a5cff"]];
const TY=[["atk","脈衝炮",6,"⚡"],["multi","連射陣列",3,"✦"],["pierce","穿甲彈",5,"🎯"],["block","能量護盾",5,"🛡️"],["heal","修復模組",4,"💊"],["draw","資料鏈路",0,"📡"],["energy","核心充能",0,"🔋"],["poison","病毒注入",3,"☣️"],["buff","基因增幅",0,"🧬"],["drain","汲能觸鬚",4,"🩸"]];
const TYL={atk:"⚡ 攻擊",multi:"✦ 連擊",pierce:"🎯 穿甲",block:"🛡️ 護盾",heal:"💊 治療",draw:"📡 抽牌",energy:"🔋 充能",poison:"☣️ 中毒",buff:"🧬 增幅",drain:"🩸 汲取"};
const TW=["初級","進階","精英","傳說","奇點"],M=[1,1.7,3.5,4.6,7.2],CO=[1,1,2,2,3],RN=["N","R","SR","SSR","UR"],RC=["#8fa3b8","#4da3ff","#b56bff","#ffb020","#ff3d6e"];
const SP={draw:[1,2,2,3,3],energy:[1,2,2,3,3],buff:[1,1,2,3,4],poison:[3,5,8,12,18]},SC=[0,1,1,2,2];
const CARDS=[];
E.forEach((e,ei)=>TY.forEach((t,ti)=>{for(let k=0;k<5;k++){const ty=t[0];let v=SP[ty]?SP[ty][k]:Math.round(t[2]*M[k]*(ty=="multi"?.75:1));
CARDS.push({id:ei*50+ti*5+k,n:e[0]+TW[k]+t[1],t:ty,v,h:ty=="multi"?(k<2?2:k<4?3:4):1,cost:(ty=="draw"||ty=="energy")?SC[k]:CO[k],r:k,e:ei,ic:t[3]})}}));
const dsc=c=>({atk:`造成 ${c.v} 傷害`,multi:`${c.h} 次各 ${c.v} 傷害`,pierce:`${c.v} 穿透傷害(無視護盾)`,block:`獲得 ${c.v} 護盾`,heal:`回復 ${c.v} 生命`,draw:`抽 ${c.v} 張牌`,energy:`獲得 ${c.v} 能量`,poison:`施加 ${c.v} 層毒素`,buff:`永久 +${c.v} 攻擊力`,drain:`造成 ${c.v} 傷害並回復等量`}[c.t]);
const cardH=(c,x="",st="")=>`<div class="card r${c.r} ${x}" style="--c:${RC[c.r]};--e:${E[c.e][2]};${st}"><span class="cs o">${c.cost}</span><span class="rt o">${RN[c.r]}</span><div class="ar">${c.ic}</div><div class="nm">${c.n}</div><div class="ds">${dsc(c)}</div></div>`;

let S,B=null,tab="battle",fl=-1,busy=false;
const K="nexus_cards_v1";
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S){S={chips:1500,own:{},deck:[],stage:1,pity:0,pulls:0};const p=CARDS.filter(c=>c.r==0).sort(()=>Math.random()-.5);
[...p.filter(c=>c.t=="atk"||c.t=="block"||c.t=="multi").slice(0,6),...p.filter(c=>!["atk","block","multi"].includes(c.t)).slice(0,6)].forEach(c=>S.own[c.id]=1);
S.deck=Object.keys(S.own).map(Number);save()}
if(!S.lastCollect){S.lastCollect=Date.now();save()}initMissions();initUp()}
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 導覽 ---------- */
let navTab="";
function updChips(){const c=$("chips"),t="◈ "+S.chips;if(c.textContent!=t){const f=!c.textContent;c.textContent=t;if(!f){c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}}}
function pageIn(){const m=$("main");m.classList.add("sw");setTimeout(()=>m.classList.remove("sw"),450)}
function go(k){if(tab==k)return;if(tab=="reactor"&&reactorTimer){clearInterval(reactorTimer);reactorTimer=null}tab=k;pageIn();render()}
function fx(){const P=B.P,X=B.X,pv=B.pv||{p:P.hp,x:X.hp};
[["xp",pv.x,X.hp],["pp",pv.p,P.hp]].forEach(([id,a,b])=>{if(a!=b){const el=$(id);el.classList.add(b<a?"hurt":"heal");const f=document.createElement("div");f.className="fl "+(b<a?"fd":"fh");f.textContent=(b<a?"-":"+")+Math.abs(a-b);el.appendChild(f)}});
B.pv={p:P.hp,x:X.hp};B.deal=false}
function render(){updChips();
if(navTab!=tab){navTab=tab;$("nav").innerHTML=[["battle","⚔️ 戰鬥"],["gacha","🎴 抽卡"],["coll","📚 卡庫"],["deck","🃏 牌組"],["mission","📋 任務"],["up","🧬 強化"],["relic","🏺 遺物"],["reactor","⚡ 反應爐"]].map(([k,n])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}
if(tab=="battle")B&&!B.over?rBattle():rHome();
else if(tab=="gacha")rGacha();
else if(tab=="coll")rColl();else if(tab=="deck")rDeck();else if(tab=="mission")rMission();else if(tab=="up")rUp();else if(tab=="relic")rRelic();else rReactor()}

/* ---------- 戰鬥 ---------- */
function rHome(){$("main").innerHTML=`<div class="pn" style="text-align:center"><h3 class="o">SECTOR ${S.stage}</h3><p style="color:var(--dim);margin:4px 0 12px">${S.stage%5==0?"⚠ 首領關卡":"入侵者偵測中"}</p><p>出戰牌組:<b style="color:var(--cy)">${S.deck.length}</b> / 20 張</p><button class="btn" onclick="startBattle()">▶ 進入戰鬥</button></div>
<div class="pn"><h3>玩法說明</h3><p style="font-size:13px;line-height:1.7;color:var(--dim);margin:0">每回合獲得 3 點能量並抽至 5 張牌。點擊手牌出牌,能量不足無法使用。結束回合後敵人會依「意圖」行動。勝利可獲得晶片,用於抽卡。到「牌組」點卡牌可調整出戰牌組(最多 20 張,至少 5 張)。高稀有度卡牌現在每點能量的效果更強,UR 也只需 3 點能量即可打出。</p></div>
<div class="pn"><span class="tag">已收集 ${Object.keys(S.own).length}/250</span><span class="tag">總抽數 ${S.pulls}</span><span class="tag">最高 SECTOR ${S.stage}</span></div>`}
function startBattle(){if(S.deck.length<5)return alert("牌組至少需要 5 張牌!");pageIn();
const st=S.stage,boss=st%5==0,mr=Math.min(4,Math.floor((st+2)/5));
const pool=CARDS.filter(c=>c.r<=mr&&!["draw","energy"].includes(c.t));
const nm=rnd(["虛空","機械","暗網","量子","熔核","霜藍"])+rnd(["哨兵","獵手","巨像","AI","無人機","指揮官"]);
const hp=Math.round((28+st*9)*(boss?Math.max(1.25,1.7-st*.04):1));

function missionDate(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function missionSeed(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}

function makeDailyMissions(date){
  let seed=missionSeed(date);
  const pool=[...MQ];
  const list=[];

  for(let i=0;i<3;i++){
    seed=(seed*1664525+1013904223)>>>0;
    const index=seed%pool.length;
    const base=pool.splice(index,1)[0];

    const m={...base,progress:0,claimed:false};

    if(["atk","block"].includes(m.id)){
      m.target=8+(seed%7);
    }

    if(["heal","draw","energy"].includes(m.id)){
      m.target=4+(seed%5);
    }

    if(m.id==="poison"){
      m.target=8+(seed%9);
    }

    if(m.id==="pull"){
      m.target=3+(seed%4);
    }

    m.reward=Math.round(m.reward+(m.target-1)*4);
    list.push(m);
  }

  return list;
}

function initMissions(){
  const today=missionDate();

  if(!S.missions||S.missions.date!==today){
    S.missions={
      date:today,
      list:makeDailyMissions(today),
      battle:{elements:[],lowcost:false,toxin:false}
    };
    save();
  }

  if(!S.missions.battle){
    S.missions.battle={elements:[],lowcost:false,toxin:false};
  }
}

function missionAdd(id,n=1){
  initMissions();

  S.missions.list.forEach(m=>{
    if(m.id===id&&!m.claimed){
      m.progress=Math.min(m.target,m.progress+n);
    }
  });

  save();

  if(tab==="mission"){
    renderMissionBody();
  }
}

function missionBattleStart(){
  initMissions();

  S.missions.battle={
    elements:[],
    toxin:false,
    lowcost:false
  };
}

function missionCardPlayed(c){

  const typeMap={
    atk:"atk",
    block:"block",
    heal:"heal",
    draw:"draw",
    energy:"energy"
  };

  if(typeMap[c.t]){
    missionAdd(typeMap[c.t],1);
  }

  if(c.t==="poison"){
    missionAdd("poison",c.v);
  }

  const battle=S.missions.battle;

  if(!battle.elements.includes(c.e)){
    battle.elements.push(c.e);

    if(battle.elements.length>=3){
      missionAdd("element",1);
    }
  }
}

function missionPoisonCheck(target){
  if(!S.missions||!target)return;

  const battle=S.missions.battle;

  if(!battle.toxin&&target.po>=8){
    battle.toxin=true;
    missionAdd("toxin",1);
  }
}

function missionBattleWin(){
  missionAdd("win",1);

  const avg=S.deck.length
    ? S.deck.reduce((sum,id)=>sum+CARDS[id].cost,0)/S.deck.length
    : 999;

  if(avg<1.5){
    missionAdd("lowcost",1);
  }

  if(S.missions){
    S.missions.battle={elements:[],lowcost:false,toxin:false};
    save();
  }
}

function missionPull(n){
  missionAdd("pull",n);
}

function claimMission(i){
  initMissions();

  const m=S.missions.list[i];

  if(!m||m.claimed||m.progress<m.target){
    return;
  }

  m.claimed=true;
  S.chips+=m.reward;S.qp=(S.qp||0)+1;

  save();
  updChips();
  renderMissionBody();
}

function rMission(){
  initMissions();

  $("main").innerHTML=`
    <div class="pn mission-head">
      <div>
        <h3 class="o">DAILY QUANTUM TASKS</h3>
        <p style="font-size:12px;color:var(--dim);margin:0">
          完成任務並收取晶片，明天將重新分配任務。
        </p>
      </div>
      <div class="mission-date">${S.missions.date}</div>
    </div>
    <div id="missionBody"></div>
  `;

  renderMissionBody();
}

function renderMissionBody(){
  initMissions();

  const list=S.missions.list;
  const done=list.filter(m=>m.claimed).length;
  const totalReward=list.reduce((sum,m)=>sum+(m.claimed?m.reward:0),0);

  $("missionBody").innerHTML=`
    <div class="pn">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>今日進度 <b style="color:var(--cy)">${done}/3</b></span>
        <span class="tag" style="color:var(--gr)">已收取 ◈ ${totalReward}</span>
      </div>
    </div>
    ${list.map((m,i)=>{
      const ratio=Math.min(100,m.progress/m.target*100);
      const ready=m.progress>=m.target&&!m.claimed;

      return `
        <div class="pn mission-card ${m.progress>=m.target?"done":""} ${m.claimed?"claimed":""}">
          <div class="mission-row">
            <div class="mission-icon">${m.icon}</div>
            <div class="mission-info">
              <div class="mission-title">${m.name}</div>
              <div class="mission-desc">${m.desc}</div>
            </div>
            <div class="mission-progress">${m.progress}/${m.target}</div>
          </div>

          <div class="bar">
            <i style="width:${ratio}%;background:${m.claimed?"var(--dim)":m.progress>=m.target?"var(--gr)":"var(--cy)"}"></i>
          </div>

          ${
            m.claimed
              ? `<button class="btn" disabled>✓ 已收取 ◈ ${m.reward}</button>`
              : ready
                ? `<button class="btn" onclick="claimMission(${i})">收取獎勵 ◈ ${m.reward}</button>`
                : `<button class="btn" disabled>任務進行中 ◈ ${m.reward}</button>`
          }
        </div>
      `;
    }).join("")}
  `;
}
const UPN=[{id:"hp1",col:0,ic:"❤️",n:"強化外殼",d:"最大生命 +10",max:5,cost:[1,1,2,2,3],req:null},{id:"bl1",col:0,ic:"🛡️",n:"回合護盾",d:"每回合開始 +3 護盾",max:3,cost:[2,2,3],req:"hp1"},{id:"rg1",col:0,ic:"💚",n:"自我修復",d:"每回合開始回復 2 生命",max:3,cost:[2,3,4],req:"bl1"},{id:"dmg1",col:1,ic:"⚔️",n:"武器超頻",d:"基礎傷害 +1",max:5,cost:[1,2,2,3,3],req:null},{id:"mu1",col:1,ic:"✦",n:"連射校準",d:"連擊每發傷害 +1",max:2,cost:[2,3],req:"dmg1"},{id:"pois1",col:1,ic:"☣️",n:"病毒強化",d:"施加毒素 +1 層",max:3,cost:[2,3,4],req:"mu1"},{id:"en1",col:2,ic:"🔋",n:"能源擴充",d:"能量上限 +1",max:2,cost:[3,5],req:null},{id:"dr1",col:2,ic:"📡",n:"資料鏈路",d:"每回合多抽 1 張",max:2,cost:[3,5],req:"en1"},{id:"gold1",col:2,ic:"💰",n:"晶片回收",d:"勝利晶片 +10%",max:3,cost:[2,3,4],req:"dr1"}];const UPB=["❤️ 生存","⚔️ 武器","🔋 戰術"];function upv(id){return S.up&&S.up[id]||0}function upHp(){return 80+upv("hp1")*10}function upEn(){return 3+upv("en1")}function initUp(){if(typeof S.qp!=="number")S.qp=3;if(!S.up)S.up={};save()}function buyUp(id){const n=UPN.find(x=>x.id===id),lv=upv(id);if(!n||lv>=n.max)return;if(n.req&&upv(n.req)<1)return;const c=n.cost[lv];if(S.qp<c)return;S.qp-=c;S.up[id]=lv+1;save();rUp()}function resetUp(){if(!confirm("重置所有強化並退回全部量子點數？"))return;UPN.forEach(n=>{for(let i=0;i<upv(n.id);i++)S.qp+=n.cost[i]});S.up={};save();rUp()}function rUp(){initUp();const y=$("main").scrollTop,col=i=>UPN.filter(n=>n.col===i).map((n,k)=>{const lv=upv(n.id),open=!n.req||upv(n.req)>0,mx=lv>=n.max,c=mx?0:n.cost[lv],ok=open&&!mx&&S.qp>=c,st=mx?"max":open?"open":"lock";return`${k?`<div class="up-link ${open?"on":""}"></div>`:""}<div class="up-node ${st}"><div class="up-ic">${n.ic}</div><div class="up-nm">${n.n}</div><div class="up-lv o">Lv ${lv}/${n.max}</div><div class="up-ds">${n.d}</div><button class="btn" onclick="buyUp('${n.id}')" ${ok?"":"disabled"}>${mx?"已滿級":open?"◆ "+c:"🔒 未解鎖"}</button></div>`}).join("");$("main").innerHTML=`<div class="pn" style="display:flex;justify-content:space-between;align-items:center"><div><h3 class="o" style="margin:0">UPGRADE MATRIX</h3><p style="font-size:12px;color:var(--dim);margin:4px 0 0">消耗量子點數，永久強化角色。</p></div><span class="tag" style="color:var(--cy);font-size:14px">◆ ${S.qp}</span></div><div class="up-core o">🧬 NEXUS 核心</div><div class="up-fork"></div><div class="up-cols">${[0,1,2].map(i=>`<div class="up-col"><div class="up-br">${UPB[i]}</div>${col(i)}</div>`).join("")}</div><div class="pn" style="margin-top:10px;font-size:12px;color:var(--dim);line-height:1.7">取得量子點數：每場勝利 ◆1，首領關 ◆3，每個每日任務收取 ◆1。</div><button class="btn" style="width:100%;margin-bottom:10px" onclick="resetUp()">重置強化</button>`;$("main").scrollTop=y}
const RL=[{id:"r_hp",ic:"🫀",n:"強化心核",d:"戰鬥開始最大生命 +15"},{id:"r_str",ic:"💢",n:"戰鬥興奮劑",d:"戰鬥開始攻擊力 +1"},{id:"r_pois",ic:"🧪",n:"毒囊",d:"戰鬥開始敵人帶 4 層毒素"},{id:"r_shield",ic:"🛡️",n:"護盾發生器",d:"每回合開始 +4 護盾"},{id:"r_regen",ic:"💚",n:"再生模組",d:"每回合開始回復 2 生命"},{id:"r_en",ic:"⚡",n:"過載電池",d:"第一回合 +1 能量"},{id:"r_draw",ic:"📡",n:"預知晶片",d:"第一回合多抽 2 張牌"},{id:"r_vamp",ic:"🩸",n:"汲能齒輪",d:"使用攻擊卡時回復 1 生命"},{id:"r_free",ic:"♻️",n:"零點回路",d:"使用 0 耗能卡時抽 1 張牌"},{id:"r_gold",ic:"💰",n:"戰利品掃描",d:"勝利時額外獲得 25% 晶片"}];function initRelics(){if(!Array.isArray(S.relics))S.relics=[];if(!Array.isArray(S.rl))S.rl=[]}function rlOn(id){return!!(S.rl&&S.rl.indexOf(id)>=0)}function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0a1424;border:1px solid var(--cy);color:var(--cy);padding:8px 14px;border-radius:20px;font-size:13px;z-index:20;white-space:nowrap";document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}function relicStart(){B.turn=0;const P=B.P,X=B.X;if(rlOn("r_hp")){P.max+=15;P.hp+=15}if(rlOn("r_str"))P.st+=1;if(rlOn("r_pois"))X.po+=4}function relicTurn(){const P=B.P;B.turn=(B.turn||0)+1;if(rlOn("r_shield"))P.bl+=4;if(rlOn("r_regen"))P.hp=Math.min(P.max,P.hp+2);if(B.turn===1){if(rlOn("r_en"))P.en+=1;if(rlOn("r_draw"))drawC(2)}}function relicPlay(c){const P=B.P;if(rlOn("r_vamp")&&["atk","multi","pierce"].includes(c.t))P.hp=Math.min(P.max,P.hp+1);if(rlOn("r_free")&&c.cost===0)drawC(1)}function relicWin(){if(rlOn("r_gold")){const b=Math.round((100+S.stage*30)*.25);S.chips+=b;toast("💰 戰利品掃描 +◈ "+b)}}function relicGet(id){initRelics();if(S.relics.indexOf(id)<0)S.relics.push(id);if(S.rl.length<3&&S.rl.indexOf(id)<0)S.rl.push(id);save();const r=RL.find(x=>x.id===id);toast("獲得遺物 "+r.ic+" "+r.n)}function relicDrop(){initRelics();const pool=RL.filter(r=>S.relics.indexOf(r.id)<0).sort(()=>Math.random()-.5).slice(0,3);if(!pool.length){S.chips+=300;save();updChips();toast("遺物已全數收集，獲得 ◈ 300");return}const o=document.createElement("div");o.className="ov";o.innerHTML=`<h3 class="o">BOSS RELIC</h3><p style="color:var(--dim);font-size:13px;margin:0">擊敗首領！選擇一個遺物帶走</p><div class="rl-pick">${pool.map(r=>`<div class="rl-card own" data-id="${r.id}"><div class="rl-ic">${r.ic}</div><div class="rl-nm">${r.n}</div><div class="rl-ds">${r.d}</div></div>`).join("")}</div>`;o.querySelectorAll(".rl-card").forEach(el=>{el.onclick=()=>{relicGet(el.dataset.id);o.remove()}});document.body.appendChild(o)}function toggleRelic(id){initRelics();const i=S.rl.indexOf(id);if(i>=0)S.rl.splice(i,1);else if(S.rl.length<3)S.rl.push(id);else return alert("最多裝備 3 個遺物，請先卸下一個");save();rRelic()}function rRelic(){initRelics();const slots=[0,1,2].map(i=>{const r=RL.find(x=>x.id===S.rl[i]);return`<div class="rl-slot ${r?"on":""}">${r?r.ic:"＋"}</div>`}).join("");$("main").innerHTML=`<div class="pn"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="o" style="margin:0">RELICS</h3><span class="tag" style="color:var(--cy)">收集 ${S.relics.length}/${RL.length}</span></div><p style="font-size:12px;color:var(--dim);margin:6px 0 0">擊敗首領可獲得遺物，最多裝備 3 個，戰鬥中自動生效。</p></div><div class="rl-slots">${slots}</div><div class="rl-grid">${RL.map(r=>{const own=S.relics.indexOf(r.id)>=0,eq=S.rl.indexOf(r.id)>=0;return own?`<div class="rl-card own ${eq?"eq":""}" onclick="toggleRelic('${r.id}')"><div class="rl-ic">${r.ic}</div><div class="rl-nm">${r.n}</div><div class="rl-ds">${r.d}</div><div class="rl-st">${eq?"✔ 已裝備":"點擊裝備"}</div></div>`:`<div class="rl-card lock"><div class="rl-ic">❔</div><div class="rl-nm">？？？</div><div class="rl-ds">擊敗首領解鎖</div></div>`}).join("")}</div>`}
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,nav button,.tabs button");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,d=document.createElement("span");d.className="rp";d.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),550)});
load();render();
